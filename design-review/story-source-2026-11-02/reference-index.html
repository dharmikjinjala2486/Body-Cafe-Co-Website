<title>Body Café Co.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Everyday supplements that name the form, state the amount and tell you when to take it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600&family=Young+Serif&display=swap">
<style>
/* Layout: an open café menu. Chalk page, one dark menu board as the signature, saucers carry each product's real dosage form in its label colour. */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#2B2929; --muted:#67625F; --line:#DCD8D1;
  --board:#2B2929; --board-ink:#F4F1EA; --board-muted:#B9B2A8; --chalk:#F6F5F1;
  --focus:#465665; --ok:#3F6B4F; --warn:#8A5A1E;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:clamp(2.6rem,1.6rem + 4.6vw,5.4rem); --s2:clamp(1.9rem,1.3rem + 2.6vw,3.3rem); --s3:clamp(1.35rem,1.1rem + 1vw,1.9rem);
  --wrap:1180px; --read:640px; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1A19; --surface:#242221; --ink:#EEEBE5; --muted:#ABA49B; --line:#3A3735;
  --board:#0F0E0E; --board-ink:#F4F1EA; --board-muted:#A39B90; --chalk:#1B1A19;
  --focus:#A9B8C7; --ok:#8BC2A0; --warn:#E0B070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1A19; --surface:#242221; --ink:#EEEBE5; --muted:#ABA49B; --line:#3A3735;
  --board:#0F0E0E; --board-ink:#F4F1EA; --board-muted:#A39B90; --chalk:#1B1A19;
  --focus:#A9B8C7; --ok:#8BC2A0; --warn:#E0B070; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:768px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.read{max-width:var(--read)}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:clamp(1.08rem,1rem + .4vw,1.3rem);line-height:1.6}
.muted{color:var(--muted)}
.section{padding-block:clamp(64px,8vw,120px)}
.stack{display:grid;gap:18px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:500;font-size:.98rem;text-decoration:none;transition:transform .2s ease,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{min-height:40px;padding:0 16px;font-size:.9rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
.tag.hold{color:var(--warn);border-color:currentColor}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.mark{display:flex;flex-direction:column;line-height:1;text-decoration:none;background:none;border:0;padding:6px 0}
.mark b{font-family:var(--display);font-weight:400;font-size:1.32rem;letter-spacing:.02em}
.mark span{font-family:var(--mono);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{display:none;gap:4px}
.nav button{background:none;border:0;padding:10px 12px;border-radius:8px;font-size:.92rem;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:500}
.nav button:hover{color:var(--ink)}
.menu-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
@media(min-width:1024px){.nav{display:flex}.menu-btn{display:none}}
.sheet{position:fixed;inset:0;z-index:80;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);overflow:auto}
.sheet .wrap{display:grid;gap:8px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.sheet nav{display:grid;margin-top:12px}
.sheet nav button{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;font-family:var(--display);font-size:1.7rem}
.sheet nav button small{display:block;font-family:var(--body);font-size:.85rem;color:var(--muted)}
/* hero */
.hero{padding-block:clamp(40px,6vw,88px) clamp(48px,6vw,96px)}
.hero-grid{display:grid;gap:40px;align-items:center}
@media(min-width:960px){.hero-grid{grid-template-columns:1.05fr .95fr;gap:56px}}
.hero h1{font-size:var(--s1);margin-top:14px}
.hero .lede{margin-top:20px;max-width:34ch}
.hero .btns{margin-top:28px}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.36s}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
/* menu board */
.board{background:var(--board);color:var(--board-ink);border-radius:20px;padding:clamp(22px,3.4vw,40px);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.06),transparent 60%)}
.board h3{font-size:var(--s3);color:var(--board-ink)}
.board .eyebrow{color:var(--board-muted)}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px dashed rgba(244,241,234,.28);padding-bottom:14px;margin-bottom:6px}
.mline{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:10px;padding:11px 0;width:100%;background:none;border:0;color:inherit;text-align:left;border-bottom:1px solid rgba(244,241,234,.08)}
.mline:last-child{border-bottom:0}
.mline .nm{font-weight:500;font-size:.98rem;display:flex;align-items:center;gap:10px;min-width:0}
.mline .nm i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.mline .dots{border-bottom:1.5px dotted rgba(244,241,234,.35);transform:translateY(-4px);min-width:16px}
.mline .amt{font-family:var(--mono);font-size:.82rem;color:var(--board-muted);text-align:right;white-space:nowrap}
.mline .sub{grid-column:1/-1;font-family:var(--mono);font-size:.72rem;color:var(--board-muted);margin-top:-2px;padding-left:20px}
button.mline:hover .nm{text-decoration:underline;text-underline-offset:4px}
@media(max-width:420px){.mline .amt{white-space:normal;max-width:12ch}}
.board-foot{margin-top:14px;font-family:var(--mono);font-size:.7rem;color:var(--board-muted);letter-spacing:.04em}
/* saucers */
.saucer{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 50%,var(--surface) 0 47%,transparent 47.5%),var(--acc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 18px 40px -24px rgba(0,0,0,.45)}
.saucer svg{width:46%;height:auto}
.prod-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.pcard{display:grid;grid-template-rows:auto 1fr;gap:16px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .25s ease,box-shadow .25s ease;width:100%}
.pcard:hover{transform:translateY(-3px);box-shadow:0 20px 40px -28px rgba(0,0,0,.4)}
.pcard .saucer{width:62%;margin-inline:auto}
.pcard h3{font-size:1.4rem}
.pcard .line{color:var(--muted);font-size:.95rem;margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.facts span{font-family:var(--mono);font-size:.72rem;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:22px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* sections */
.split{display:grid;gap:32px}
@media(min-width:900px){.split{grid-template-columns:5fr 7fr;gap:64px}}
.big{font-size:var(--s2)}
.quote{font-family:var(--display);font-size:clamp(1.6rem,1.1rem + 2.2vw,2.9rem);line-height:1.15;text-wrap:balance}
.rules{display:grid;gap:0;border-top:1px solid var(--line)}
.rule{display:grid;gap:8px;padding:22px 0;border-bottom:1px solid var(--line)}
@media(min-width:700px){.rule{grid-template-columns:220px 1fr;gap:28px}}
.rule h3{font-size:1.45rem}
.tension{background:var(--surface);border-block:1px solid var(--line)}
.shout{font-family:var(--display);font-size:clamp(1.5rem,1rem + 2vw,2.4rem);line-height:1.2}
.shout s{text-decoration-thickness:2px;color:var(--muted)}
.proof{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.proof div{padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.proof b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem;margin-bottom:6px}
.proof p{font-size:.95rem;color:var(--muted)}
.hold-note{font-family:var(--mono);font-size:.72rem;color:var(--warn);margin-top:10px}
.day{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-top:32px}
.slot{border-radius:var(--r);padding:20px;background:var(--surface);border:1px solid var(--line)}
.slot .eyebrow{margin-bottom:10px}
.slot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot li{display:flex;gap:10px;align-items:center;font-size:.95rem}
.slot li i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.manifesto{background:var(--board);color:var(--board-ink)}
.manifesto p{font-family:var(--display);font-size:clamp(1.45rem,1rem + 2vw,2.5rem);line-height:1.2}
.manifesto p.dim{color:var(--board-muted)}
.manifesto .stack{gap:10px}
.journal{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.journal article{padding:22px;border-top:2px solid var(--ink);background:var(--surface);border-radius:0 0 var(--r) var(--r)}
.journal h3{font-size:1.3rem;margin-block:8px}
.journal p{color:var(--muted);font-size:.95rem}
.final{text-align:center}
.final .quote{max-width:20ch;margin-inline:auto}
.final .btns{justify-content:center;margin-top:28px}
/* footer */
footer{border-top:1px solid var(--line);padding-block:48px calc(48px + env(safe-area-inset-bottom,0px));font-size:.9rem}
.fgrid{display:grid;gap:28px}
@media(min-width:800px){.fgrid{grid-template-columns:1.2fr 1fr 1.4fr}}
.flinks{display:grid;gap:4px}
.flinks button{background:none;border:0;text-align:left;padding:6px 0;min-height:40px;color:var(--muted)}
.flinks button:hover{color:var(--ink)}
.legal{font-size:.8rem;color:var(--muted);line-height:1.55}
.sel{user-select:all;font-family:var(--mono);font-size:.85rem}
/* our story */
.story-hero{padding-block:clamp(56px,9vw,140px) clamp(40px,6vw,80px)}
.story-hero h1{font-size:var(--s1);max-width:14ch}
.chapter{padding-block:clamp(48px,7vw,104px);border-top:1px solid var(--line)}
.chapter .num{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;color:var(--muted)}
.chapter h2{font-size:var(--s2);margin-block:12px 28px;max-width:18ch}
.prose{display:grid;gap:1.1em;max-width:62ch;font-size:clamp(1.05rem,1rem + .25vw,1.2rem);line-height:1.75}
.prose .first::first-letter{font-family:var(--display);float:left;font-size:4.2em;line-height:.82;padding:6px 10px 0 0}
.pull{font-family:var(--display);font-size:clamp(1.5rem,1.1rem + 1.8vw,2.4rem);line-height:1.2;max-width:24ch;padding-left:20px;border-left:3px solid var(--ink);margin-block:16px}
.formlist{display:grid;gap:10px;margin-top:8px}
.formrow{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.formrow .saucer{width:44px}
.formrow b{font-weight:500}
.formrow span{display:block;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* product page */
.crumb{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted);padding-top:20px}
.crumb button{background:none;border:0;padding:6px 0;min-height:40px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.phero{display:grid;gap:32px;padding-block:24px clamp(48px,6vw,88px);align-items:center}
@media(min-width:900px){.phero{grid-template-columns:.9fr 1.1fr;gap:64px}}
.phero .saucer{width:min(78%,420px);margin-inline:auto}
.phero h1{font-size:var(--s2);margin-block:12px 18px}
.claim{display:inline-block;margin-top:16px;font-size:.92rem;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.claim small{display:block;font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.timing{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.timing div{border-radius:12px;padding:14px 10px;text-align:center;border:1px solid var(--line);background:var(--surface)}
.timing div.best{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timing b{display:block;font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.timing span{font-size:.82rem}
.pgrid{display:grid;gap:40px}
@media(min-width:900px){.pgrid{grid-template-columns:1fr 1fr;gap:56px}}
.pblock h2{font-size:var(--s3);margin-bottom:14px}
.pblock p{max-width:60ch}
.label-panel{border:1px dashed var(--line);border-radius:var(--r);padding:20px;font-size:.9rem;display:grid;gap:10px}
.label-panel b{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.pnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px;margin-top:48px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid currentColor;color:var(--warn);font-size:.92rem;margin-top:16px}
/* sourcing */
.makers{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.maker{padding:24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:12px;align-content:start}
.maker h3{font-size:1.35rem}
.maker .where{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.maker ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.maker li{display:flex;gap:10px;align-items:center}
.maker li i{width:12px;height:12px;border-radius:50%;flex:none}
.explorer{display:grid;gap:24px}
@media(min-width:900px){.explorer{grid-template-columns:320px 1fr}}
.xlist{display:grid;gap:8px;align-content:start}
.xlist button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center}
.xlist button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.xlist i{width:12px;height:12px;border-radius:50%;flex:none}
.xpanel{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:clamp(20px,3vw,32px);display:grid;gap:16px;min-width:0}
.xpanel h3{font-size:var(--s3)}
.kv{display:grid;gap:0;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.kv dt{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;min-width:0}
.pending{color:var(--muted);font-style:italic}
/* feedback */
.fb{display:grid;gap:28px;max-width:760px}
.q{display:grid;gap:12px;padding:22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.q legend,.q label.qt{font-weight:500;font-size:1rem;padding:0}
fieldset.q{margin:0;min-width:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{display:grid;place-items:center;min-height:48px;border-radius:10px;border:1px solid var(--line);font-family:var(--mono);font-size:.95rem;cursor:pointer;background:var(--bg)}
.scale input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
textarea,input[type=text]{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:.95rem}
.consent input{width:22px;height:22px;margin-top:2px;flex:none}
.status{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.95rem}
.status.ok{border-color:var(--ok);color:var(--ok)}
.status.err{border-color:var(--warn);color:var(--warn)}
.results{display:grid;gap:16px}
.bar{display:grid;grid-template-columns:minmax(0,170px) 1fr 52px;gap:12px;align-items:center;font-size:.92rem}
.bar .track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--ink);border-radius:99px}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
/* review notes */
.notes-btn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;box-shadow:0 10px 30px -14px rgba(0,0,0,.4)}
.drawer{position:fixed;inset:auto 0 0 0;z-index:90;max-height:80vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -20px 60px -30px rgba(0,0,0,.5);padding-block:20px calc(24px + env(safe-area-inset-bottom,0px))}

    <p class="lede" style="margin-top:20px;max-width:60ch">Below is every active ingredient in our range, the form we use, and the manufacturer that makes the finished product. We are adding the origin of each raw material as supplier documents are confirmed, and we will update this page when we do.</p>
  </div></section>
  <section class="section tension" style="padding-top:48px"><div class="wrap">
    <h2 class="big" style="margin-bottom:24px">Explore the forms.</h2>
    <div class="explorer">
      <div class="xlist" role="group" aria-label="Choose a product">${PRODUCTS.map(q=>`<button data-x="${q.slug}" aria-pressed="${q.slug===xsel}"><i style="background:${q.acc}"></i>${esc(q.name)}</button>`).join("")}</div>

          <div><dt>Per serving</dt><dd>${p.amounts.filter(a=>!/sugar/i.test(a[0])).map(a=>esc(a[0]+": "+a[1])).join("<br>")}</dd></div>
          <div><dt>Finished product made by</dt><dd>${esc(m.name)}, ${esc(m.place)}</dd></div>

    </div>
  </div></section>
  <section class="section"><div class="wrap">
    <h2 class="big" style="margin-bottom:24px">Three makers, all in Gujarat.</h2>
    <div class="makers">${Object.entries(MAKERS).map(([k,m])=>`<div class="maker"><p class="where">${esc(m.place)} · FSSAI Lic. ${m.lic}</p><h3>${esc(m.name)}</h3><p class="muted">${esc(m.what)}</p>
      <ul>${PRODUCTS.filter(p=>p.maker===k).map(p=>`<li><i style="background:${p.acc}"></i>${esc(p.name)}</li>`).join("")}</ul></div>`).join("")}</div>
    <p class="muted" style="margin-top:18px;font-size:.9rem">Marketed by ${esc(BRAND.legalEntity)}. FSSAI Lic. No. ${BRAND.fssai}.</p>

function contact(){
  return `<section class="section" style="padding-top:clamp(40px,6vw,80px)"><div class="wrap read">
    <p class="eyebrow">Contact</p><h1 class="big" style="margin-top:12px">Ask us anything.</h1>
    <p class="lede" style="margin-top:18px">If something isn't clear on a label, or you want to know more about how a product is made, write to us. We'll answer in plain language, and we'll tell you where the answer comes from.</p>
    <dl class="kv" style="margin-top:28px">
      <div><dt>Email</dt><dd><span class="sel">${BRAND.email}</span> <button class="btn ghost small" data-copy="${BRAND.email}" style="margin-left:8px">Copy</button></dd></div>
      <div><dt>Phone</dt><dd><span class="sel">${BRAND.phone}</span></dd></div>
      <div><dt>Address</dt><dd>${esc(BRAND.legalEntity)}</dd></div>
    </dl>
    <p class="muted" style="margin-top:20px">We can explain our products, but we can't give medical advice. For questions about your health, please speak with a doctor.</p>

const DIMS=[["understanding","Brand understanding","I understood what Body Café Co. stands for."],["emotion","Emotional connection","The story made me feel something."],["trust","Trust","The brand feels credible and honest."],["premium","Premium perception","The brand feels premium."],["memorable","Memorability","I will remember this brand tomorrow."],["interest","Product interest","I want to learn more about the products."],["overall","Overall impression","My overall impression is positive."]];
function feedback(){
  return `<section class="section" style="padding-top:clamp(40px,6vw,80px)"><div class="wrap">
    <p class="eyebrow">Team review</p><h1 class="big" style="margin-top:12px;max-width:18ch">Tell us what the story did for you.</h1>
    <p class="lede" style="margin-top:16px;max-width:58ch">Explore the site first: the homepage, Our story and two or three products. Then answer below. Your answers are saved to this shared review, one response per person, and you can update yours later.</p>
    <div id="fbStatus" class="status" style="margin-top:24px">Connecting to the response store…</div>
    <form class="fb" id="fbForm" style="margin-top:28px" novalidate>
      <div class="q"><label class="qt" for="f_says">In one sentence, what does Body Café Co. stand for?</label><textarea id="f_says" name="says"></textarea></div>
      <div class="q"><label class="qt" for="f_diff">What makes it different from other supplement brands?</label><textarea id="f_diff" name="diff"></textarea></div>
      <div class="q"><label class="qt" for="f_mem">Which part of the story was most memorable?</label><textarea id="f_mem" name="mem"></textarea></div>
      ${DIMS.map(([k,t,s])=>`<fieldset class="q"><legend>${t}<span class="muted" style="display:block;font-weight:400;font-size:.92rem">${s}</span></legend>
        <div class="scale">${[1,2,3,4,5].map(v=>`<input type="radio" id="r_${k}_${v}" name="${k}" value="${v}"><label for="r_${k}_${v}">${v}</label>`).join("")}</div>
        <div class="ends"><span>Strongly disagree</span><span>Strongly agree</span></div></fieldset>`).join("")}
      <div class="q"><label class="qt" for="f_like">What did you like most?</label><textarea id="f_like" name="like"></textarea></div>
      <div class="q"><label class="qt" for="f_confuse">What was confusing or felt unsupported?</label><textarea id="f_confuse" name="confuse"></textarea></div>
      <div class="q"><label class="qt" for="f_trust">What would make you trust the brand more?</label><textarea id="f_trust" name="trustmore"></textarea></div>
      <label class="consent" for="f_consent"><input type="checkbox" id="f_consent" name="consent"><span>I agree that my answers are stored with this review and seen by the Body Café Co. team. No other personal details are collected.</span></label>
      <div class="btns"><button class="btn" type="submit" id="fbSubmit">Save my response</button></div>
      <div id="fbMsg" role="status" aria-live="polite"></div>
    </form>
    <section id="fbResults" hidden style="margin-top:56px"></section>
  </div></section>`;
}

function notFound(){return `<section class="section"><div class="wrap"><h1 class="big">That page isn't on the menu.</h1><div class="btns" style="margin-top:20px"><button class="btn" data-go="">Back to home</button></div></div></section>`}

/* ======================= ROUTER ======================= */
function navHTML(cur,sheet){
  return ROUTES.filter(r=>r.id!==""||sheet).map(r=>`<button data-go="${r.id}" ${r.id===cur?'aria-current="page"':""}>${r.label}${sheet&&r.sub?`<small>${r.sub}</small>`:""}</button>`).join("");
}
function footerHTML(){
  return `<div class="wrap fgrid">
    <div class="stack" style="gap:10px"><span class="mark"><b>Body Café Co.</b></span><p class="muted">${esc(BRAND.tagline)}</p>
      <p><span class="sel">${BRAND.email}</span><br><span class="sel">${BRAND.phone}</span></p></div>
    <div class="flinks">${ROUTES.map(r=>`<button data-go="${r.id}">${r.label}</button>`).join("")}<button data-go="contact-us">Contact</button></div>
    <p class="legal">Body Café Co. is a brand of ${esc(BRAND.legalEntity)}. FSSAI Lic. No. ${BRAND.fssai}. Nutraceuticals and health supplements are not for medicinal use and are not intended to diagnose, treat, cure or prevent any disease. Do not exceed the recommended dose. Not a substitute for a varied diet. Pregnant or lactating women and people under medical care should consult a healthcare professional before use.<br><br>© 2026 Bluebell Lifecare Pvt. Ltd.</p>
  </div>`;
}
let feedbackBooted=false;
function render(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  let html, cur=h, title="Body Café Co.";
  if(!h){html=home();}
  else if(h==="our-story"){html=ourStory();title="Our story · Body Café Co."}
  else if(h==="products"){html=products();title="Products · Body Café Co."}
  else if(h.startsWith("p-")){html=product(h.slice(2));cur="products";const p=P(h.slice(2));if(p)title=p.name+" · Body Café Co."}
  else if(h==="science-and-quality"){html=science();title="Science & quality · Body Café Co."}
  else if(h==="ingredients-and-sourcing"){html=sourcing();title="Ingredients & sourcing · Body Café Co."}
  else if(h==="contact-us"){html=contact();title="Contact · Body Café Co."}
  else if(h==="feedback"){html=feedback();title="Brand feedback · Body Café Co."}
  else if(h==="main"){return}
  else html=notFound();
  const main=$("#main"); main.innerHTML=`<div class="view">${html}</div>`;
  document.title=title;
  $("#nav").innerHTML=navHTML(cur,false); $("#sheetNav").innerHTML=navHTML(cur,true);
  closeSheet(false);
  window.scrollTo({top:0,behavior:"instant"});
  setupReveal();
  if(h==="feedback") bootFeedback();
}
function setupReveal(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver" in window)) return;
  const els=[...document.querySelectorAll(".reveal")];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
  els.forEach(el=>{const r=el.getBoundingClientRect(); if(r.top>innerHeight){el.classList.add("pre");io.observe(el)}});
}

/* ======================= MENU + NOTES ======================= */
let lastFocus=null;
function openSheet(){lastFocus=document.activeElement;$("#sheet").hidden=false;$("#menuBtn").setAttribute("aria-expanded","true");document.body.style.overflow="hidden";$("#closeBtn").focus()}
function closeSheet(restore=true){if($("#sheet").hidden)return;$("#sheet").hidden=true;$("#menuBtn").setAttribute("aria-expanded","false");document.body.style.overflow="";if(restore&&lastFocus)lastFocus.focus()}
$("#menuBtn").addEventListener("click",openSheet);
$("#closeBtn").addEventListener("click",()=>closeSheet());
$("#drawer").innerHTML=`<div class="wrap" style="max-width:none"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><b>Review notes</b><button class="btn ghost small" id="notesClose">Close</button></div>
  <p class="muted" style="font-size:.88rem;margin-top:6px">For the team only. What is held, missing or pending approval on this preview.</p><ul>${NOTES.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;
$("#notesBtn").addEventListener("click",()=>{const d=$("#drawer");d.hidden=!d.hidden;$("#notesBtn").setAttribute("aria-expanded",String(!d.hidden));if(!d.hidden)$("#notesClose").focus()});
document.addEventListener("click",e=>{
  if(e.target.id==="notesClose"){$("#drawer").hidden=true;$("#notesBtn").setAttribute("aria-expanded","false");$("#notesBtn").focus();return}
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();go(g.dataset.go);return}
  const f=e.target.closest("[data-filter]"); if(f){filter=f.dataset.filter;const y=scrollY;$("#main").innerHTML=`<div>${products()}</div>`;window.scrollTo(0,y);document.querySelector(`[data-filter="${filter}"]`).focus();return}
  const x=e.target.closest("[data-x]"); if(x){xsel=x.dataset.x;const y=scrollY;$("#main").innerHTML=`<div>${sourcing()}</div>`;window.scrollTo(0,y);document.querySelector(`[data-x="${xsel}"]`).focus();return}
  const c=e.target.closest("[data-copy]"); if(c){const t=c.dataset.copy;const done=()=>{c.textContent="Copied"};try{navigator.clipboard.writeText(t).then(done,()=>selectNear(c))}catch(_){selectNear(c)}}
});
function selectNear(btn){const s=btn.parentElement.querySelector(".sel");if(!s)return;const r=document.createRange();r.selectNodeContents(s);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent="Press Ctrl/⌘+C"}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();if(!$("#drawer").hidden){$("#drawer").hidden=true;$("#notesBtn").setAttribute("aria-expanded","false")}}});
$("#skip").addEventListener("click",e=>{e.preventDefault();$("#main").setAttribute("tabindex","-1");$("#main").focus()});
$("#footer").innerHTML=footerHTML();
addEventListener("hashchange",render);

/* ======================= FEEDBACK STORE (db capability) ======================= */
let DB=null, USER=null, UID=null, unsub=null;
const capP = (window.claude && claude.use) ? Promise.all([claude.use("db"),claude.use("user")]) : Promise.resolve([null,null]);
function setStatus(cls,msg){const s=$("#fbStatus");if(s){s.className="status "+cls;s.textContent=msg}}
async function bootFeedback(){
  const form=$("#fbForm"); if(!form) return;
  form.addEventListener("submit",submitFeedback);
  const timer=setTimeout(()=>setStatus("err","The response store didn't answer. Open this page from its shared link while signed in to claude.ai to save a response."),10000);
  let db,user; try{[db,user]=await capP}catch(_){db=null;user=null}
  clearTimeout(timer);
  if(!$("#fbForm")) return;
  if(!db){setStatus("err","Responses can't be saved in this view. Open the shared link while signed in to claude.ai. Nothing you type here is stored.");$("#fbSubmit").disabled=true;return}
  DB=db; USER=user;
  try{UID=user?await user.id():null}catch(_){UID=null}
  if(!UID){setStatus("err","We couldn't identify your account, so responses can't be saved here.");$("#fbSubmit").disabled=true;return}
  const canWrite=user&&user.can?await user.can("data.write"):null;
  setStatus("", canWrite===false?"You can read this page but not save a response. Ask the owner for Contributor access.":"Connected. Your response is saved to this shared review.");
  try{const snap=await DB.doc("responses/"+UID).get(); const d=snap&&snap.exists?snap.data():null; if(d) prefill(d)}catch(_){}
  const isAdmin=user&&((user.isOwner&&await user.isOwner())||(user.canEdit&&await user.canEdit()));
  if(isAdmin) watchResults();
}
function prefill(d){
  ["says","diff","mem","like","confuse","trustmore"].forEach(k=>{const el=document.querySelector(`[name="${k}"]`);if(el&&d[k])el.value=d[k]});
  DIMS.forEach(([k])=>{if(d[k]){const r=$(`#r_${k}_${d[k]}`);if(r)r.checked=true}});
  if(d.consent) $("#f_consent").checked=true;
  $("#fbMsg").innerHTML=`<div class="status">You submitted a response on ${esc(new Date(d.submittedAt).toLocaleString())}. Saving again updates it.</div>`;
}
async function submitFeedback(e){
  e.preventDefault();
  const fd=new FormData(e.target), msg=$("#fbMsg");
  const missing=DIMS.filter(([k])=>!fd.get(k)).map(d=>d[1]);
  if(missing.length){msg.innerHTML=`<div class="status err">Please rate: ${esc(missing.join(", "))}.</div>`;return}
  if(!fd.get("consent")){msg.innerHTML=`<div class="status err">Tick the consent box to save your response.</div>`;return}
  if(!DB||!UID){msg.innerHTML=`<div class="status err">This view can't save responses. Open the shared link while signed in.</div>`;return}
  const data={v:1,submittedAt:new Date().toISOString(),consent:true};
  ["says","diff","mem","like","confuse","trustmore"].forEach(k=>data[k]=String(fd.get(k)||"").slice(0,2000));
  DIMS.forEach(([k])=>data[k]=Number(fd.get(k)));
  const btn=$("#fbSubmit"); btn.disabled=true; btn.textContent="Saving…";
  try{await DB.doc("responses/"+UID).set(data);msg.innerHTML=`<div class="status ok">Saved. Thank you. You can change your answers and save again at any time.</div>`}
  catch(err){msg.innerHTML=`<div class="status err">Your response wasn't saved (${esc(err&&err.code||"error")}). If you only have view access, ask the owner for Contributor access.</div>`}
  btn.disabled=false; btn.textContent="Save my response";
}
function watchResults(){
  const box=$("#fbResults"); if(!box) return; box.hidden=false;
  box.innerHTML=`<p class="eyebrow">Owner view</p><h2 class="big" style="margin-top:10px">Responses so far</h2><p class="muted" style="margin-top:8px">Loading…</p>`;
  if(unsub){try{unsub()}catch(_){}}
  unsub=DB.collection("responses").onSnapshot(snap=>{
    const rows=[];snap.forEach(d=>rows.push(d.data()));
    if(!$("#fbResults")) return;
    if(!rows.length){box.innerHTML=`<p class="eyebrow">Owner view</p><h2 class="big" style="margin-top:10px">No responses yet</h2><p class="muted" style="margin-top:8px">Share this page with the team. Responses appear here as they arrive.</p>`;return}
    const avg=k=>rows.reduce((s,r)=>s+(r[k]||0),0)/rows.length;
    const open=(k,t)=>{const v=rows.map(r=>r[k]).filter(Boolean);return v.length?`<div class="q"><b>${t}</b><ul style="margin:0;padding-left:18px;display:grid;gap:6px">${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""};
    box.innerHTML=`<p class="eyebrow">Owner view · only you and Editors see this</p><h2 class="big" style="margin-top:10px">${rows.length} response${rows.length>1?"s":""}</h2>
      <div class="results" style="margin-top:24px">${DIMS.map(([k,t])=>{const a=avg(k);return `<div class="bar"><span>${t}</span><div class="track"><div class="fill" style="width:${a/5*100}%"></div></div><span class="v">${a.toFixed(1)}</span></div>`}).join("")}</div>
      <div class="fb" style="margin-top:28px">${open("says","What the brand stands for")}${open("diff","What makes it different")}${open("mem","Most memorable")}${open("like","Liked most")}${open("confuse","Confusing or unsupported")}${open("trustmore","Would build more trust")}</div>`;
  },err=>{box.innerHTML=`<div class="status err">Couldn't load responses (${esc(err&&err.code||"error")}).</div>`});
}

render();
</script>
